<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Audio player</title>
</head>
<body>
    <!-- Master controls -->
     <section id="master-controls">
    <button id="master-toggle">
        <span>🔊</span> Pause All
    </button>
<div class="player-container">
    <header class="header">
<div class="master-volume">
    <label for="master-vol">Master Volume</label>
    <input type="range" id="master-vol" min="0" max="100" value="80">
</div>
    <h1>Audio Mixer</h1>
    <p>Make your own atmosphere</p>
    <!-- Presets -->
    <div class="presets">
        <button class="preset-btn"> Forest</button>
        <button class="preset-btn"> Cozy Campfire</button>
        <button class="preset-btn"> Mountain Rain</button>
    </div>
    <!-- Sound grid -->
     <main class="sound-grid">

    <!-- Campfire -->
     <article class="sound-card" data-sound="campfire">
        <div class="card-header">
            <h3>🔥 Crackling Campfire</h3>
            </div>
            <div class="slider-group">
                <input type="range" class="volume-slider" min="0" max="100" value="0">
            </div>
            <button class="toggle-btn">Start</button>
            <audio id="audio-campfire" src="assets/campfire.mp3" loop></audio>
     </article>
     <!--Rain-->
<article class="sound-card" data-sound="rain">
        <div class="card-header">
            <h3>🌧️ Gentle Rain</h3>
            </div>
            <div class="slider-group">
                <input type="range" class="volume-slider" min="0" max="100" value="0">
            </div>
            <button class="toggle-btn">Start</button>
            <audio id="audio-rain" src="assets/rain.mp3" loop></audio>
     </article>
     <!-- Birds -->
     <article class="sound-card" data-sound="birds">
        <div class="card-header">
            <h3>🐦 Forest Birds</h3>
            </div>
            <div class="slider-group">
                <input type="range" class="volume-slider" min="0" max="100" value="0">
            </div>
            <button class="toggle-btn">Start</button>
            <audio id="audio-birds" src="assets/birds.mp3" loop></audio>
     </article>
<!-- River -->
     <article class="sound-card" data-sound="river">
        <div class="card-header">
            <h3>🌊 River Stream</h3>
            </div>
            <div class="slider-group">
                <input type="range" class="volume-slider" min="0" max="100" value="0">
            </div>
            <button class="toggle-btn">Start</button>
            <audio id="audio-river" src="assets/river.mp3" loop></audio>
     </article>
     <!-- Wind -->
     <article class="sound-card" data-sound="wind">
        <div class="card-header">
            <h3>🍃 Soft Wind</h3>
            </div>
            <div class="slider-group">
                <input type="range" class="volume-slider" min="0" max="100" value="0">
            </div>
            <button class="toggle-btn">Start</button>
            <audio id="audio-wind" src="assets/wind.mp3" loop></audio>
     </article>  
     <!-- Sleep timer -->
      <section class="timer-section">
        <h3>⏱️ Sleep Timer</h3>
        <div class="timer-buttons">
            <button data-time="15">15 min</button>
            <button data-time="30">30 min</button>
            <button data-time="60">60 min</button>
        </div>
        <p id="timer-display">Timer inactive</p>
      </section>
     </main>
</section>
</header>
</div>
<script src="script.js"></script>
</body>
</html>
